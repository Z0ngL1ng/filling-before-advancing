<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="860" viewBox="0 0 1800 860" role="img" aria-labelledby="title desc">
  <title id="title">Audited CPRS and HarborEval construction workflows</title>
  <desc id="desc">Two separated workflows show how training supervision and the diagnostic benchmark are curated, audited, and exported.</desc>
  <defs>
    <marker id="arrow-teal" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#2a8d8a"/>
    </marker>
    <marker id="arrow-orange" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto">
      <path d="M0,0 L11,5.5 L0,11 Z" fill="#c77834"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#172b3a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 34px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #172b3a; }
      .lane { font: 700 27px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #172b3a; }
      .box-title { font: 700 21px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #172b3a; }
      .box-sub { font: 400 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #425466; }
      .chip-title { font: 700 19px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #172b3a; }
      .chip-sub { font: 400 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #425466; }
      .separation { font: 600 19px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #354a5f; }
      .footer { font: 500 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; fill: #52677b; }
    </style>
  </defs>

  <rect width="1800" height="860" rx="24" fill="#ffffff"/>
  <text x="900" y="48" text-anchor="middle" class="title">Audited Resource Construction and Separation</text>

  <rect x="34" y="72" width="1732" height="292" rx="22" fill="#f1faf9" stroke="#b8dfdc" stroke-width="2"/>
  <text x="62" y="108" class="lane">CPRS training supervision</text>

  <g filter="url(#shadow)">
    <rect x="54" y="132" width="280" height="118" rx="15" fill="#ffffff" stroke="#69b8b4" stroke-width="2"/>
    <rect x="407" y="132" width="280" height="118" rx="15" fill="#ffffff" stroke="#69b8b4" stroke-width="2"/>
    <rect x="760" y="132" width="280" height="118" rx="15" fill="#ffffff" stroke="#69b8b4" stroke-width="2"/>
    <rect x="1113" y="132" width="280" height="118" rx="15" fill="#ffffff" stroke="#69b8b4" stroke-width="2"/>
    <rect x="1466" y="132" width="280" height="118" rx="15" fill="#ffffff" stroke="#69b8b4" stroke-width="2"/>
  </g>

  <g text-anchor="middle">
    <text x="194" y="168" class="box-title">Source collection</text>
    <text x="194" y="199" class="box-sub"><tspan x="194">Heterogeneous public</tspan><tspan x="194" dy="23">RS and maritime sources</tspan></text>

    <text x="547" y="168" class="box-title">Modality normalization</text>
    <text x="547" y="199" class="box-sub"><tspan x="547">RGB / SAR / PAN / NIR</tspan><tspan x="547" dy="23">observability constraints</tspan></text>

    <text x="900" y="168" class="box-title">SMT curation</text>
    <text x="900" y="199" class="box-sub"><tspan x="900">Ground evidence → synthesize</tspan><tspan x="900" dy="23">→ verify / rewrite / drop</tspan></text>

    <text x="1253" y="168" class="box-title">Quality audit</text>
    <text x="1253" y="199" class="box-sub"><tspan x="1253">Deduplication, missing images,</tspan><tspan x="1253" dy="23">leakage and claim checks</tspan></text>

    <text x="1606" y="168" class="box-title">Train-only export</text>
    <text x="1606" y="199" class="box-sub"><tspan x="1606">Image-text or ShareGPT</tspan><tspan x="1606" dy="23">records without audit fields</tspan></text>
  </g>

  <g stroke="#2a8d8a" stroke-width="4" fill="none" marker-end="url(#arrow-teal)">
    <path d="M337 191 H397"/>
    <path d="M690 191 H750"/>
    <path d="M1043 191 H1103"/>
    <path d="M1396 191 H1456"/>
  </g>

  <g>
    <rect x="54" y="275" width="520" height="66" rx="13" fill="#e4f4f2"/>
    <rect x="640" y="275" width="520" height="66" rx="13" fill="#e4f4f2"/>
    <rect x="1226" y="275" width="520" height="66" rx="13" fill="#e4f4f2"/>
    <text x="74" y="302" class="chip-title">D1 · RS-Anchor</text>
    <text x="74" y="326" class="chip-sub">3,135,250 source samples → 569,853 unique image-caption pairs</text>
    <text x="660" y="302" class="chip-title">D2 · Bridging-Conv</text>
    <text x="660" y="326" class="chip-sub">187,296 multi-source SFT records across four modalities</text>
    <text x="1246" y="302" class="chip-title">D3 · Scenario-EG</text>
    <text x="1246" y="326" class="chip-sub">53,000 train-only records over 8,703 images</text>
  </g>

  <line x1="70" y1="408" x2="1730" y2="408" stroke="#91a4b5" stroke-width="2" stroke-dasharray="9 9"/>
  <rect x="488" y="383" width="824" height="50" rx="25" fill="#f7f9fb" stroke="#a9b7c4" stroke-width="2"/>
  <text x="900" y="415" text-anchor="middle" class="separation">Source-record holdout keeps HarborEval outside every training export</text>

  <rect x="34" y="452" width="1732" height="342" rx="22" fill="#fff7ef" stroke="#ead0b3" stroke-width="2"/>
  <text x="62" y="488" class="lane">HarborEval diagnostic benchmark</text>

  <g filter="url(#shadow)">
    <rect x="54" y="512" width="280" height="118" rx="15" fill="#ffffff" stroke="#dda467" stroke-width="2"/>
    <rect x="407" y="512" width="280" height="118" rx="15" fill="#ffffff" stroke="#dda467" stroke-width="2"/>
    <rect x="760" y="512" width="280" height="118" rx="15" fill="#ffffff" stroke="#dda467" stroke-width="2"/>
    <rect x="1113" y="512" width="280" height="118" rx="15" fill="#ffffff" stroke="#dda467" stroke-width="2"/>
    <rect x="1466" y="512" width="280" height="118" rx="15" fill="#ffffff" stroke="#dda467" stroke-width="2"/>
  </g>

  <g text-anchor="middle">
    <text x="194" y="548" class="box-title">Record selection</text>
    <text x="194" y="579" class="box-sub"><tspan x="194">Harbor and non-harbor</tspan><tspan x="194" dy="23">remote-sensing records</tspan></text>

    <text x="547" y="548" class="box-title">Source holdout</text>
    <text x="547" y="579" class="box-sub"><tspan x="547">Exclude assigned sources and</tspan><tspan x="547" dy="23">derived conversations from training</tspan></text>

    <text x="900" y="548" class="box-title">Eight-track construction</text>
    <text x="900" y="579" class="box-sub"><tspan x="900">Perception, grounding, reasoning,</tspan><tspan x="900" dy="23">observability, reporting, rejection</tspan></text>

    <text x="1253" y="548" class="box-title">Benchmark audit</text>
    <text x="1253" y="579" class="box-sub"><tspan x="1253">Cleaning, modality checks,</tspan><tspan x="1253" dy="23">accepted sets and ambiguity review</tspan></text>

    <text x="1606" y="548" class="box-title">Frozen evaluation</text>
    <text x="1606" y="579" class="box-sub"><tspan x="1606">Public inference + private answers</tspan><tspan x="1606" dy="23">→ track metrics → macro score</tspan></text>
  </g>

  <g stroke="#c77834" stroke-width="4" fill="none" marker-end="url(#arrow-orange)">
    <path d="M337 571 H397"/>
    <path d="M690 571 H750"/>
    <path d="M1043 571 H1103"/>
    <path d="M1396 571 H1456"/>
  </g>

  <g>
    <rect x="54" y="655" width="430" height="103" rx="13" fill="#ffead8"/>
    <rect x="513" y="655" width="430" height="103" rx="13" fill="#ffead8"/>
    <rect x="972" y="655" width="774" height="103" rx="13" fill="#ffead8"/>
    <text x="74" y="686" class="chip-title">Scope</text>
    <text x="74" y="713" class="chip-sub">1,245 items / 471 unique images</text>
    <text x="74" y="738" class="chip-sub">1,154 structured + 91 open-ended</text>
    <text x="533" y="686" class="chip-title">Public inference records</text>
    <text x="533" y="713" class="chip-sub">Image, question and choices only</text>
    <text x="533" y="738" class="chip-sub">0 disallowed private-field violations</text>
    <text x="992" y="686" class="chip-title">Private answer and audit records</text>
    <text x="992" y="713" class="chip-sub">Answers, evidence, accepted labels/cells, references, forbidden claims and rubrics</text>
    <text x="992" y="738" class="chip-sub">Merged only after inference for deterministic scoring and auditable judging</text>
  </g>

  <text x="900" y="832" text-anchor="middle" class="footer">Training supervision and evaluation packages are curated separately; private answer-bearing fields never enter model prompts.</text>
</svg>
